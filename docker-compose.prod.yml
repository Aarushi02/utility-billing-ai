services:
  api:
    ports:
      - "127.0.0.1:8000:8000"

  streamlit:
    ports: []

  va-api:
    ports:
      - "127.0.0.1:8001:8000"

  va-streamlit:
    ports: []

  nginx:
    image: nginx:alpine
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - streamlit
      - va-streamlit
    restart: unless-stopped
