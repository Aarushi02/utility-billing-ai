services:
  api:
    ports:
      - "127.0.0.1:8000:8000"

  streamlit:
    ports:
      - "127.0.0.1:8501:8501"

  nginx:
    image: nginx:alpine
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - streamlit
    restart: unless-stopped
