services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: utility-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AIRFLOW_API_URL: ${AIRFLOW_API_URL:-http://airflow:8080/api/v2}
      API_BASE_URL: http://api:8000
      LOG_SOURCE: api
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  streamlit:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: utility-streamlit
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      LOG_SOURCE: streamlit
      VA_STREAMLIT_URL: /va
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"

  va-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: utility-va-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BASE_URL: http://va-api:8001
      LOG_SOURCE: va-api
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  va-streamlit:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: utility-va-streamlit
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BASE_URL: http://va-api:8000
      LOG_SOURCE: va-streamlit
    depends_on:
      va-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8502:8501"
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.baseUrlPath=/va"]

  airflow:
    profiles:
      - airflow
    image: apache/airflow:3.0.0
    container_name: utility-airflow
    restart: unless-stopped
    env_file:
      - .env
    user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-airflow-secret}
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_API_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_API_PASSWORD:-admin}
      LOG_SOURCE: airflow
    command: bash -c "airflow db migrate && airflow standalone"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
