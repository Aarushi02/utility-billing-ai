server {
    listen 80;
    server_name _;

    client_max_body_size 250M;

    # Docker's internal DNS resolver — forces nginx to re-resolve upstream
    # hostnames on every request instead of caching IPs at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Virginia Audit — routes to va-streamlit (port 8501 internal)
    location /va {
        set $va_upstream http://utility-va-streamlit:8501;
        proxy_pass         $va_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # New York Audit + Portal — routes to ny streamlit (port 8501 internal)
    location / {
        set $ny_upstream http://streamlit:8501;
        proxy_pass         $ny_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
