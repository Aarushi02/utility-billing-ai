name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Send deploy command to EC2
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0393dd4f827866db2" \
            --document-name "AWS-RunShellScript" \
            --region us-east-2 \
            --comment "GitHub Actions deploy - ${{ github.sha }}" \
            --parameters 'commands=[
              "cd /home/ubuntu/utility-billing-ai",
              "git fetch origin main",
              "git checkout main",
              "git reset --hard origin/main",
              "bash scripts/fetch_secrets.sh",
              "docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build",
              "docker compose ps"
            ]' \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for deploy to complete
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0393dd4f827866db2" \
              --region us-east-2 \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/30] Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deploy succeeded."
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deploy FAILED."
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for deploy."
          exit 1

      - name: Print deploy output
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "i-0393dd4f827866db2" \
            --region us-east-2 \
            --query "[StandardOutputContent, StandardErrorContent]" \
            --output text
